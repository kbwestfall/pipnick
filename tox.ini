[tox]
envlist =
    {3.12,3.13,3.14}-test{,-cov}
    {3.12,3.13,3.14}-test-{numpy,astropy}dev
    3.12-test-photutilsmin
    codestyle
requires =
    setuptools >= 77.0
    pip >= 22.0
isolated_build = true

[testenv]
# Suppress display of matplotlib plots generated during the tests
setenv =
    MPLBACKEND=agg
    numpydev: PIP_EXTRA_INDEX_URL = https://pypi.anaconda.org/scientific-python-nightly-wheels/simple
    astropydev: PIP_EXTRA_INDEX_URL = https://pypi.anaconda.org/astropy/simple

passenv = HOME,WINDIR,LC_ALL,LC_CTYPE,CC,CI

# Run the tests in a temporary directory to make sure that we don't import
# this package from the source tree
changedir = .tmp/{envname}

description =
    run tests
    numpydev: with the latest developer version of numpy
    astropydev: with the latest developer version of astropy
    photutilsmin: with the minimum supported version of photutils
    cov: and test coverage

# NOTE: PSF photometry depends on photutils.psf.MoffatPSF and the photutils 3.x
# PSF-photometry interface, so the minimum supported photutils is tested as an
# explicit axis.
deps =
    cov: coverage

    numpydev: numpy>=0.0.dev0
    astropydev: astropy>=0.0.dev0
    photutilsmin: photutils==3.0.0

extras =
    test

commands =
    pip freeze
    !cov: pytest --pyargs pipnick {posargs}
    cov: pytest --pyargs pipnick --cov pipnick --cov-config={toxinidir}/pyproject.toml {posargs}
    cov: coverage xml -o {toxinidir}/coverage.xml

[testenv:codestyle]
skip_install = true
changedir = .
description = check code style, e.g. with pycodestyle
deps = pycodestyle
commands = pycodestyle pipnick --count

[pycodestyle]
# E9 catches syntax and runtime errors; E501 holds the line length.  The rest of
# pycodestyle is not enforced, since it flags a great deal that is a matter of
# taste rather than correctness.
select = E9,E501
max-line-length = 99
