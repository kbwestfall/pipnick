version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.13"

sphinx:
   configuration: docs/conf.py
   # TODO: Set to true once the documentation builds without warnings; the
   # astrometry pipeline currently fails to import, which autodoc reports.
   fail_on_warning: false

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
