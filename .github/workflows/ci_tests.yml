
name: CI Tests

on:
  workflow_dispatch:

  pull_request:
    types:
      - opened
      - reopened
      - labeled
      - synchronize

  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      success: ${{ steps.check.outputs.success }}
    steps:
      - name: Check for protected branch or PR label
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Always pass the gate for pushes directly to the protected branch
          if [ "${{ github.event_name }}" = "push" ]; then
            BRANCH="${{ github.ref_name }}"
            if [ "$BRANCH" = "main" ]; then
              echo "Push to protected branch '$BRANCH' — bypassing label check."
              echo "success=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            PR_NUMBER="${{ github.event.pull_request.number }}"
          else
            PR_NUMBER=$(gh pr list \
              --repo "${{ github.repository }}" \
              --head "${{ github.ref_name }}" \
              --state open \
              --json number \
              --jq '.[0].number')
          fi

          if [ -z "$PR_NUMBER" ]; then
            echo "No open PR found for this branch — skipping."
            echo "success=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LABEL_COUNT=$(gh pr view "$PR_NUMBER" \
            --repo "${{ github.repository }}" \
            --json labels \
            --jq '.labels | length')

          if [ "$LABEL_COUNT" -gt 0 ]; then
            echo "success=true" >> "$GITHUB_OUTPUT"
          else
            echo "success=false" >> "$GITHUB_OUTPUT"
          fi

  ci-tests:
    needs: validate
    if: needs.validate.outputs.success == 'true'
    name: Tox env ${{ matrix.python }}-${{ matrix.toxenv }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-latest]
        python: ['3.12', '3.13', '3.14']
        toxenv: [test]
    steps:
    - name: Check out repository
      uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python }}
    - name: Install base dependencies
      run: |
        python -m pip install --upgrade pip tox
    - name: Test with tox
      run: |
        tox -e ${{ matrix.python }}-${{ matrix.toxenv }}

  dev-tests:
    needs: validate
    if: needs.validate.outputs.success == 'true'
    name: Tox env ${{ matrix.python }}-${{ matrix.toxenv }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-latest]
        python: ['3.13']
        toxenv: [test-numpydev, test-astropydev]
    steps:
    - name: Check out repository
      uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python }}
    - name: Install base dependencies
      run: |
        python -m pip install --upgrade pip tox
    - name: Test with tox
      run: |
        tox -e ${{ matrix.python }}-${{ matrix.toxenv }}

  # PSF photometry relies on photutils.psf.MoffatPSF and the photutils 3.x
  # PSF-photometry interface, so the minimum supported photutils is pinned as
  # an explicit axis.
  photutils-tests:
    needs: validate
    if: needs.validate.outputs.success == 'true'
    name: Tox env ${{ matrix.python }}-${{ matrix.toxenv }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12']
        toxenv: [test-photutilsmin]
    steps:
    - name: Check out repository
      uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python }}
    - name: Install base dependencies
      run: |
        python -m pip install --upgrade pip tox
    - name: Test with tox
      run: |
        tox -e ${{ matrix.python }}-${{ matrix.toxenv }}

  os-tests:
    needs: validate
    if: needs.validate.outputs.success == 'true'
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      # set this to false so windows failures don't prevent macos tests from finishing
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        python: ['3.12', '3.13', '3.14']
        toxenv: [test]
    steps:
    - name: Check out repository
      uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python }}
    - name: Install base dependencies
      run: |
        python -m pip install --upgrade pip tox
    - name: Test with tox
      run: |
        tox -e ${{ matrix.python }}-${{ matrix.toxenv }}

  codestyle:
    needs: validate
    if: needs.validate.outputs.success == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7
    - name: Python codestyle check
      uses: actions/setup-python@v7
      with:
        python-version: '3.13'
    - name: Install base dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install tox
    - name: Check code style
      run: |
        tox -e codestyle
