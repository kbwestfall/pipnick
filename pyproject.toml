[project]
name = "pipnick"
dynamic = ["version"]
authors = [
    { name = "Allison K. Eto", email = "allisonketo@gmail.com" },
    { name = "Kyle B. Westfall", email = "westfall@ucolick.org" },
]
license = "BSD-3-Clause"
license-files = [
    "LICENSE.rst", "licenses/PYPEIT_LICENSE.rst", "licenses/ASTROPY_LICENSE.rst",
    "licenses/MANGADAP_LICENSE.rst"
]
description = "Photometric Pipeline for the Nickel Telescope"
keywords = [
    "photometry",
    "astrometry",
    "astronomy",
    "Nickel",
    "Lick",
    "UCO",
    "instrumentation",
]
readme = "README.md"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: User Interfaces",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
requires-python = ">=3.12,<3.15"
dependencies = [
    "astropy>=7.0",
    "astroquery>=0.4",
    "ccdproc>=2.4",
    "matplotlib>=3.9",
    "numpy>=2.0",
    "photutils>=3.0",
    "reproject>=0.14",
    "scikit-image>=0.24",
    "scipy>=1.13",
    "speclite>=0.20",
]

[project.optional-dependencies]
test = [
    "coverage",
    "pytest>=7.0.0",
    "pytest-astropy",
    "pytest-cov",
    "tox",
]
docs = [
    "docutils<0.22",
    "numpydoc>=1.8",
    "pydata-sphinx-theme>=0.22",
    "sphinx>6",
    "sphinx-design",
]
dev = [
    "pipnick[test,docs]",
    "setuptools_scm",
]

[project.urls]
Repository = "https://github.com/allisoneto/pipnick"

[project.scripts]
pipnick_version = "pipnick.scripts.version:Version.entry_point"
pipnick_metadata = "pipnick.scripts.metadata:MetaData.entry_point"
pipnick_reduce = "pipnick.scripts.reduce:Reduce.entry_point"
pipnick_astrometry = "pipnick.scripts.astrometry:Astrometry.entry_point"
pipnick_photometry = "pipnick.scripts.photometry:Photometry.entry_point"
pipnick_calibrate = "pipnick.scripts.calibrate:Calibrate.entry_point"
pipnick_mosaic = "pipnick.scripts.mosaic:Mosaic.entry_point"
pipnick_rgb = "pipnick.scripts.rgb:RGB.entry_point"
pipnick_status = "pipnick.scripts.status:Status.entry_point"
pipnick_report = "pipnick.scripts.report:Report.entry_point"
pipnick_inspect = "pipnick.scripts.inspect:Inspect.entry_point"

[build-system]
requires = [
    "setuptools>=77",
    "setuptools_scm>=8",
]
build-backend = 'setuptools.build_meta'

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
# Listed explicitly so that the data files are included even when they are not
# tracked by git (setuptools_scm otherwise selects the data files)
pipnick = ["data/cameras/*.toml", "data/catalogs/*.ecsv", "data/extinction/*.dat"]

[tool.setuptools.packages.find]
# Without an explicit include, namespace-package discovery also picks up
# non-package directories (e.g., licenses/) and installs them at the top level.
include = ["pipnick*"]

[tool.setuptools_scm]
version_file = "pipnick/pkg/version.py"

[tool.pytest.ini_options]
minversion = 7.0
testpaths = [
    "pipnick",
]
# Block internet access for the entire test session (pytest-remotedata); tests
# must never contact astrometry.net or the Gaia archive
remote_data_strict = true

[tool.coverage]

    [tool.coverage.run]
        omit = [
            "pipnick/conftest.py",
            "pipnick/tests/*",
            "pipnick/pkg/version*",
            "*/pipnick/conftest.py",
            "*/pipnick/tests/*",
            "*/pipnick/pkg/version*",
        ]

    [tool.coverage.report]
        exclude_lines = [
            "pragma: no cover",
            "except ImportError",
            "raise AssertionError",
            "raise NotImplementedError",
            "'def main(.*):'",
            "pragma: py{ignore_python_version}",
            "def _ipython_key_completions_",
        ]
